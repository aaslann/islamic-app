<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Varyasyon C — Geometrik Desen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e0d;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .frame {
    width: 390px;
    height: 844px;
    background: #0D1F18;
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  /* Top hero with gradient + geometric pattern */
  .hero {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 360px;
    background: linear-gradient(135deg, #145E43 0%, #0F3D2E 50%, #0D2519 100%);
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(200,162,74,.15) 0%, transparent 35%),
      radial-gradient(circle at 75% 60%, rgba(200,162,74,.1) 0%, transparent 40%);
  }
  /* SVG Geometric pattern overlay */
  .pattern {
    position: absolute;
    inset: 0;
    opacity: .12;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='none' stroke='%23C8A24A' stroke-width='1'><polygon points='40,8 56,24 56,56 40,72 24,56 24,24'/><polygon points='40,16 50,26 50,54 40,64 30,54 30,26'/><line x1='40' y1='8' x2='40' y2='72'/><line x1='24' y1='24' x2='56' y2='56'/><line x1='56' y1='24' x2='24' y2='56'/></g></svg>");
    background-size: 80px 80px;
  }
  /* Logo emblem */
  .emblem {
    position: absolute;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    width: 96px; height: 96px;
    border-radius: 30px;
    background: linear-gradient(135deg, #E0BF72 0%, #C8A24A 40%, #8A6418 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 36px rgba(200,162,74,.4),
                inset 0 1px 2px rgba(255,255,255,.4);
  }
  .emblem::before {
    content: '';
    position: absolute;
    width: 76px; height: 76px;
    border-radius: 22px;
    border: 1.5px solid rgba(255,255,255,.35);
  }
  .emblem-text {
    font-size: 40px;
    color: #0D1F18;
    font-weight: 900;
    text-shadow: 0 1px 0 rgba(255,255,255,.3);
  }
  /* Hero text */
  .hero-text {
    position: absolute;
    top: 200px; left: 0; right: 0;
    text-align: center;
    padding: 0 32px;
  }
  .hero-text .bismillah {
    font-size: 18px;
    color: #C8A24A;
    margin-bottom: 14px;
    direction: rtl;
  }
  .hero-text h1 {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.4px;
  }
  /* Floating card with form */
  .card {
    position: absolute;
    top: 320px; left: 20px; right: 20px;
    bottom: 30px;
    background: linear-gradient(180deg, #142A20 0%, #0F2218 100%);
    border-radius: 28px;
    border: 1px solid rgba(200,162,74,.15);
    box-shadow: 0 -10px 30px rgba(0,0,0,.3);
    padding: 28px 26px 24px;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #C8A24A, transparent);
  }
  .welcome {
    text-align: center;
    margin-bottom: 22px;
  }
  .welcome-label {
    font-size: 10px;
    font-weight: 700;
    color: #C8A24A;
    letter-spacing: 2.5px;
    margin-bottom: 6px;
  }
  .welcome-title {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
  }
  .welcome-sub {
    font-size: 12px;
    color: rgba(255,255,255,.5);
    margin-top: 4px;
  }
  .benefits {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .benefit {
    flex: 1;
    background: rgba(200,162,74,.06);
    border: 1px solid rgba(200,162,74,.15);
    border-radius: 14px;
    padding: 10px 8px;
    text-align: center;
  }
  .benefit-icon { font-size: 18px; }
  .benefit-text {
    font-size: 10px;
    color: rgba(255,255,255,.65);
    font-weight: 600;
    margin-top: 4px;
    line-height: 1.3;
  }
  .btn {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-gold {
    background: linear-gradient(135deg, #E0BF72 0%, #C8A24A 50%, #A07020 100%);
    color: #0D1F18;
    box-shadow: 0 6px 20px rgba(200,162,74,.25);
  }
  .btn-outline {
    background: rgba(255,255,255,.04);
    color: #fff;
    border: 1px solid rgba(255,255,255,.12);
  }
  .btn-outline svg { width: 18px; height: 18px; }
  .or-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
  }
  .or-row::before,
  .or-row::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.08);
  }
  .or-row span {
    font-size: 10px;
    color: rgba(255,255,255,.4);
    letter-spacing: 2px;
    font-weight: 700;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row .btn { flex: 1; margin-bottom: 0; }
  .guest {
    text-align: center;
    margin-top: 14px;
  }
  .guest a {
    color: rgba(255,255,255,.5);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .guest a span {
    border-bottom: 1px solid rgba(255,255,255,.2);
    padding-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="hero">
      <div class="pattern"></div>
      <div class="emblem">
        <span class="emblem-text">ا</span>
      </div>
      <div class="hero-text">
        <p class="bismillah">بِسْمِ اللهِ</p>
        <h1>İslami Asistan</h1>
      </div>
    </div>

    <div class="card">
      <div class="welcome">
        <p class="welcome-label">✦  HOŞ GELDİNİZ  ✦</p>
        <p class="welcome-title">Yolculuğa Başla</p>
        <p class="welcome-sub">Verilerin cihazlar arası senkronize olsun</p>
      </div>

      <div class="benefits">
        <div class="benefit">
          <div class="benefit-icon">☁️</div>
          <div class="benefit-text">Bulut<br/>Yedek</div>
        </div>
        <div class="benefit">
          <div class="benefit-icon">📊</div>
          <div class="benefit-text">İlerleme<br/>Takibi</div>
        </div>
        <div class="benefit">
          <div class="benefit-icon">⭐</div>
          <div class="benefit-text">Favori<br/>Ayetler</div>
        </div>
      </div>

      <button class="btn btn-gold">Giriş Yap / Kayıt Ol</button>

      <div class="or-row"><span>VEYA</span></div>

      <div class="row">
        <button class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          Google
        </button>
        <button class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="white"><path d="M17.05 12.04c-.03-3.05 2.49-4.52 2.6-4.59-1.42-2.07-3.62-2.36-4.4-2.38-1.87-.19-3.65 1.1-4.6 1.1-.96 0-2.42-1.08-3.99-1.04-2.05.03-3.95 1.19-5 3.03-2.15 3.71-.55 9.18 1.52 12.19 1.04 1.47 2.25 3.11 3.83 3.05 1.55-.06 2.13-.99 4-.99 1.87 0 2.39.99 4.02.95 1.66-.03 2.7-1.48 3.71-2.97z"/></svg>
          Apple
        </button>
      </div>

      <div class="guest">
        <a href="#"><span>Misafir olarak devam et →</span></a>
      </div>
    </div>
  </div>
</body>
</html>
