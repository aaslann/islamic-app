<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Varyasyon A — Mihrab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e0d;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .frame {
    width: 390px;
    height: 844px;
    background: linear-gradient(180deg, #0F2218 0%, #0A1A12 60%, #0D1F18 100%);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  /* Mihrab arch silhouette */
  .arch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 380px;
    border-radius: 140px 140px 0 0;
    background: linear-gradient(180deg, rgba(200,162,74,0.18) 0%, rgba(200,162,74,0.04) 60%, transparent 100%);
    border: 1px solid rgba(200,162,74,0.18);
    border-bottom: none;
  }
  .arch::before {
    content: '';
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    width: 220px; height: 320px;
    border-radius: 110px 110px 0 0;
    border: 1px solid rgba(200,162,74,0.12);
    border-bottom: none;
  }
  /* Decorative geometric pattern */
  .pattern {
    position: absolute;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 100px;
    opacity: .35;
  }
  .star8 {
    width: 60px; height: 60px;
    margin: 20px auto;
    background: linear-gradient(45deg, transparent 40%, #C8A24A 41%, #C8A24A 59%, transparent 60%),
                linear-gradient(-45deg, transparent 40%, #C8A24A 41%, #C8A24A 59%, transparent 60%),
                linear-gradient(90deg, transparent 40%, #C8A24A 41%, #C8A24A 59%, transparent 60%),
                linear-gradient(0deg, transparent 40%, #C8A24A 41%, #C8A24A 59%, transparent 60%);
    background-blend-mode: screen;
    transform: rotate(22deg);
  }
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 80px 32px 40px;
    display: flex;
    flex-direction: column;
  }
  .bismillah {
    font-size: 22px;
    color: #C8A24A;
    text-align: center;
    margin-top: 180px;
    letter-spacing: 1px;
    font-weight: 400;
    direction: rtl;
  }
  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, #C8A24A, transparent);
    margin: 24px auto;
  }
  .title {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,.55);
    text-align: center;
    margin-top: 8px;
    line-height: 1.5;
  }
  .spacer { flex: 1; }
  .auth-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,162,74,0.18);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 14px;
    backdrop-filter: blur(10px);
  }
  .auth-card-label {
    font-size: 10px;
    color: #C8A24A;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 14px;
  }
  .btn {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-gold {
    background: linear-gradient(135deg, #D4B25C 0%, #C8A24A 40%, #A07020 100%);
    color: #0D1F18;
    box-shadow: 0 4px 16px rgba(200,162,74,.25);
  }
  .btn-outline {
    background: rgba(255,255,255,0.04);
    color: #fff;
    border: 1px solid rgba(255,255,255,.12);
  }
  .btn-outline svg { width: 18px; height: 18px; }
  .guest {
    text-align: center;
    margin-top: 12px;
    padding: 14px;
  }
  .guest a {
    color: rgba(255,255,255,.5);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.15);
    padding-bottom: 2px;
  }
  .terms {
    text-align: center;
    font-size: 10px;
    color: rgba(255,255,255,.3);
    line-height: 1.6;
    margin-top: 18px;
  }
  .terms a { color: #C8A24A; text-decoration: none; }
</style>
</head>
<body>
  <div class="frame">
    <div class="arch"></div>
    <div class="pattern">
      <div class="star8"></div>
    </div>

    <div class="content">
      <p class="bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ</p>
      <div class="divider"></div>
      <h1 class="title">İslami Asistan</h1>
      <p class="subtitle">İbadetlerini takip et,<br/>Kur'an okumaya başla.</p>

      <div class="spacer"></div>

      <div class="auth-card">
        <p class="auth-card-label">✦  HESABA GİRİŞ  ✦</p>
        <button class="btn btn-gold">Giriş Yap</button>
        <button class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          Google ile devam et
        </button>
        <button class="btn btn-outline" style="margin-bottom:0">
          <svg viewBox="0 0 24 24" fill="white"><path d="M17.05 12.04c-.03-3.05 2.49-4.52 2.6-4.59-1.42-2.07-3.62-2.36-4.4-2.38-1.87-.19-3.65 1.1-4.6 1.1-.96 0-2.42-1.08-3.99-1.04-2.05.03-3.95 1.19-5 3.03-2.15 3.71-.55 9.18 1.52 12.19 1.04 1.47 2.25 3.11 3.83 3.05 1.55-.06 2.13-.99 4-.99 1.87 0 2.39.99 4.02.95 1.66-.03 2.7-1.48 3.71-2.97 1.18-1.7 1.66-3.36 1.68-3.44-.04-.02-3.21-1.23-3.24-4.87-.03-3.04 2.49-4.5 2.6-4.57-1.42-2.07-3.63-2.36-4.4-2.38l-.04.03zM14.95 3.62c.83-1.01 1.4-2.4 1.24-3.79-1.2.05-2.66.8-3.52 1.81-.78.89-1.46 2.32-1.28 3.69 1.34.1 2.71-.68 3.56-1.71z"/></svg>
          Apple ile devam et
        </button>
      </div>

      <div class="guest">
        <a href="#">Misafir olarak devam et →</a>
      </div>

      <p class="terms">
        Devam ederek <a href="#">Kullanım Şartları</a> ve <a href="#">Gizlilik</a>'i kabul edersiniz.
      </p>
    </div>
  </div>
</body>
</html>
